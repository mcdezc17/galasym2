[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "galasym2-pykage"
version = "0.1.0"
description = "Scripts Python standalone de galasym2 (flujo de asimetria de forma Pawlik+2016)"
requires-python = ">=3.9"
dependencies = [
    "numpy",
    "pandas",
    "astropy",
    "scipy",
    "matplotlib",
]

[project.scripts]
shape_asymmetry = "shape_asymmetry:main"
concat_pawlik = "concat_pawlik:main"
graph_pawlik = "graph_pawlik:main"
find_center = "find_center:main"

[tool.setuptools]
py-modules = ["shape_asymmetry", "concat_pawlik", "graph_pawlik", "find_center"]
